{% set name = "powerplantmatching" %}
{% set version = "0.9.1" %}
{% set sha256 = "14407c50ed3e7c04c49714a5e0aad14108ac2040172cad4719c316b5a722f91e" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/powerplantmatching-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - plotly >=6.9.0
    - pre-commit >=4.3.0
    - python >={{ python_min }}
    - numpy
    - scipy
    - pandas >=2.2.3,<4
    - networkx >=1.10
    - pycountry
    - country_converter
    - xlrd
    - seaborn
    - pyyaml >=5.1.0
    - requests
    - matplotlib-base
    - geopy
    - unidecode
    - entsoe-py >=0.8
    - deprecation
    - tqdm
    - openpyxl

test:
  imports:
    - powerplantmatching
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/PyPSA/powerplantmatching
  license: MIT
  license_family: MIT
  license_file: LICENSES/MIT.txt
  summary: Toolset for generating and managing Power Plant Data
  description: |
    This package provides ready-to-use power plant data for the European
    power system. Starting from openly available power plant datasets,
    the package cleans, standardizes and merges the input data to create
    a new combining dataset, which includes all the important information.
    The package allows to easily update the combined data as
    soon as new input datasets are released.
  doc_url: https://github.com/PyPSA/powerplantmatching
  dev_url: https://github.com/PyPSA/powerplantmatching

extra:
  recipe-maintainers:
    - fneum
    - lkstrp
    - FabianHofmann
    - coroa
    - davide-f
